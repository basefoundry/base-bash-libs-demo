name: Framework Compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      framework_ref:
        description: Optional immutable tag or full commit; blank tests baseline and current release
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.framework_ref || 'baseline-and-current' }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Candidate (${{ matrix.os }}, ${{ matrix.framework_ref }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        framework_ref: ${{ fromJSON(inputs.framework_ref && format('[{0}]', toJSON(inputs.framework_ref)) || '["v2.0.0","v2.2.0"]') }}
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Resolve immutable framework reference
        id: resolve
        env:
          FRAMEWORK_REF: ${{ matrix.framework_ref }}
          FRAMEWORK_REPOSITORY: https://github.com/basefoundry/base-bash-libs.git
        run: |
          resolved_commit="$(./scripts/resolve-framework-ref "$FRAMEWORK_REPOSITORY" "$FRAMEWORK_REF")"
          printf 'commit=%s\n' "$resolved_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-bash-libs
          ref: ${{ steps.resolve.outputs.commit }}
          path: .framework-candidate
          persist-credentials: false
      - name: Install supported Bash on macOS
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Exercise the candidate through Beacon
        env:
          EXPECTED_REF: ${{ matrix.framework_ref }}
          EXPECTED_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          candidate_commit="$(git -C .framework-candidate rev-parse --verify 'HEAD^{commit}')"
          if [[ "$candidate_commit" != "$EXPECTED_COMMIT" ]]; then
            printf 'Resolved commit %s does not match expected commit %s for %s.\n' \
              "$candidate_commit" "$EXPECTED_COMMIT" "$EXPECTED_REF" >&2
            exit 1
          fi
          ./tests/candidate-smoke.sh "$PWD/.framework-candidate" "" "$candidate_commit"
